spring:
  application:
    name: bit-shop
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    url: ${DATABASE_URL}
  elasticsearch:
    username:
    password:
    uris: http://localhost:9200
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  session:
    redis:
      namespace: ${SESSION_NAMESPACE}
      repository-type: default
    timeout: ${SESSION_MAX_AGE}s
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  aws:
    s3:
      access-key: ${S3_USERNAME}
      secret-key: ${S3_PASSWORD}
      url: ${S3_URL}
      bucket: ${S3_BUCKET}
      region: ${S3_REGION}
  devtools:
    livereload:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  servlet:
    session:
      cookie:
        name: ${SESSION_NAME}
        secure: ${SESSION_SECURE}
        same-site: lax
        max-age: ${SESSION_MAX_AGE}
        http-only: ${SESSION_HTTP_ONLY}
        path: /
springdoc:
  api-docs:
    version: openapi-3-1
    enabled: false
    path: /api/v1/docs
  swagger-ui:
    path: /api/v1/docs/swagger-ui
    enabled: false
